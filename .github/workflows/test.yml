name: RollFor Tests

on:
  push:
    branches: [ "master", "v3" ]
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    branches: [ "master" ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Run tests
      run: docker compose run --rm -T test

    # Runs even when the tests fail, so one push reports both.
    - name: Run checks
      if: success() || failure()
      run: docker compose run --rm -T check
